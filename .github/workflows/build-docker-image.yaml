# This workflow uses actions that are not certified by GitHub.
# They are provided by third parties and are pinned to full commit SHAs.

name: Create and publish a Docker image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ROUTE53_VERSION: "1.6.2"
  CLOUDFLARE_VERSION: "0.2.4"

jobs:
  build-and-push-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to the Container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Derive image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v?*) printf 'tag=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "expected a v-prefixed tag, got: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          pull: true
          provenance: mode=max
          sbom: true
          build-args: |
            CADDY_VERSION=${{ steps.image.outputs.tag }}
            ROUTE53_VERSION=${{ env.ROUTE53_VERSION }}
            CLOUDFLARE_VERSION=${{ env.CLOUDFLARE_VERSION }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
